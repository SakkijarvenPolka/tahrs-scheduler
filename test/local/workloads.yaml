# Workloads for test/local/run.sh. They use only native Pod fields, exactly like
# a real user would: schedulerName plus the profile annotation. The GPU pod has
# no nodeAffinity on purpose: the pool is enforced by the scheduler's
# NodeAffinity.addedAffinity, not by the workload author.
apiVersion: v1
kind: Pod
metadata:
  name: tahrs-cpu
  labels:
    app: tahrs-local-test
spec:
  schedulerName: tahrs-scheduler
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.10
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: tahrs-gpu
  labels:
    app: tahrs-local-test
  annotations:
    scheduling.example.com/profile: gpu-inference-v1
spec:
  schedulerName: tahrs-scheduler
  tolerations:
  - key: scheduling.example.com/dedicated
    operator: Equal
    value: tahrs
    effect: NoSchedule
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.10
    resources:
      limits:
        cpu: "4"
        memory: 16Gi
        nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Pod
metadata:
  name: tahrs-bad-profile
  labels:
    app: tahrs-local-test
  annotations:
    scheduling.example.com/profile: does-not-exist
spec:
  schedulerName: tahrs-scheduler
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.10
    resources:
      requests:
        cpu: "1"
        memory: 1Gi